<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Location Share — consent only</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Minimal, modern UI */
    html,body,#map { height: 100%; margin:0; }
    body { font-family: Inter, system-ui, -apple-system, Roboto, Arial; background:#0b1020; color:#eef2ff; display:flex; flex-direction:column; }
    .top { display:flex; align-items:center; gap:12px; padding:12px 16px; background:linear-gradient(90deg,#071026,#0b1730); box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
    .logo { width:44px;height:44;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#5cc3ff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#041029}
    .controls { margin-left:auto; display:flex; gap:8px; align-items:center }
    button { border:0;padding:8px 12px;border-radius:10px;font-weight:700; cursor:pointer }
    .primary { background:linear-gradient(90deg,#7c5cff,#5cc3ff); color:#041029 }
    .ghost { background:transparent; border:1px solid rgba(255,255,255,0.06); color:#d3d9e6 }
    .panel { position: absolute; right:16px; top:72px; width:320px; background:rgba(6,10,20,0.7); padding:12px;border-radius:12px; box-shadow:0 12px 40px rgba(2,6,12,0.6); }
    pre { background:rgba(255,255,255,0.02); padding:8px;border-radius:8px; font-family:monospace; overflow:auto; }
    a.small { color:#9fb7ff; text-decoration:none; font-size:13px }
    @media (max-width:900px){ .panel{left:12px; right:12px; width:auto} }
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">Y</div>
    <div>
      <div style="font-weight:800">Live Location Share</div>
      <div style="font-size:13px;color:#9aa4b2">Consent-only • Real-time • Client + Firebase</div>
    </div>
    <div class="controls">
      <button id="shareBtn" class="primary">Share my location</button>
      <button id="stopBtn" class="ghost">Stop</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="panel" id="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:700">Share preview</div>
      <div style="font-size:12px;color:#9aa4b2" id="status">idle</div>
    </div>
    <div style="height:8px"></div>
    <div style="font-size:13px">Link:</div>
    <pre id="link">—</pre>
    <div style="height:8px"></div>
    <div style="display:flex;gap:8px">
      <button id="copyBtn" class="ghost" style="flex:1">Copy</button>
      <button id="openBtn" class="primary" style="flex:1">Open</button>
    </div>
    <div style="height:8px"></div>
    <div style="font-size:13px">Coords:</div>
    <pre id="coords">—</pre>
    <div style="height:8px"></div>
    <div style="font-size:12px;color:#9aa4b2">Privacy: this app writes only after you click <strong>Share my location</strong>. The token owner can stop sharing any time.</div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase (compat CDN for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
  /*********** CONFIGURE THIS WITH FIREBASE PROJECT CONFIG ***********/
  const FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    // storageBucket, messagingSenderId, appId optional for this demo
  };
  /******************************************************************/

  // Initialize Firebase
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const auth = firebase.auth();

  // Anonymous sign-in to identify owner (recommended)
  let myUid = null;
  auth.onAuthStateChanged(u=>{
    if(u) myUid = u.uid;
    else {
      auth.signInAnonymously().catch(err=>console.error('auth error',err));
    }
  });

  // Map init
  const map = L.map('map').setView([3.0,101.0],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
  let marker = null;
  function setMarker(lat,lng,label){
    if(marker) map.removeLayer(marker);
    marker = L.marker([lat,lng]).addTo(map).bindPopup(label||'Shared location').openPopup();
    map.setView([lat,lng],16);
    document.getElementById('coords').textContent = lat.toFixed(6)+', '+lng.toFixed(6);
  }

  // Utilities
  function randToken(len=10){
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let s='';
    for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  // Elements
  const shareBtn = document.getElementById('shareBtn');
  const stopBtn  = document.getElementById('stopBtn');
  const copyBtn  = document.getElementById('copyBtn');
  const openBtn  = document.getElementById('openBtn');
  const linkEl   = document.getElementById('link');
  const statusEl = document.getElementById('status');

  let watchId = null;
  let currentToken = null;

  // Create share entry and start updating location
  async function startShare(){
    if(!navigator.geolocation){ alert('Geolocation API not available'); return; }
    setStatus('requesting permission');
    // ask for permission and get one position first to confirm
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      // create token and write initial record
      const token = randToken(12);
      currentToken = token;
      const ref = db.ref('shares/'+token);

      // ownerId = myUid (anonymous) helps enforce rules on server
      const expiresAt = Date.now() + 1000*60*60; // default 1 hour
      await ref.set({ lat, lng, ownerId: myUid || 'anon', label:'Shared location', createdAt: Date.now(), expiresAt });

      // ensure record removed if owner disconnects (best-effort)
      try {
        ref.onDisconnect().remove();
      } catch(e){ console.warn('onDisconnect failed:',e); }

      // update UI
      const url = new URL(window.location.href);
      url.searchParams.set('id', token);
      linkEl.textContent = url.toString();
      shareBtn.textContent = 'Sharing';
      setStatus('sharing');
      setMarker(lat,lng,'You (sharing)');

      // start watchPosition to update continuously
      watchId = navigator.geolocation.watchPosition(p=>{
        const la = p.coords.latitude, lo = p.coords.longitude;
        ref.update({ lat: la, lng: lo, updatedAt: Date.now() });
        setMarker(la, lo, 'You (sharing)');
      }, err=>{
        console.error('watch error',err);
      }, { enableHighAccuracy:true, maximumAge:5000, timeout:10000 });

    }, err=>{
      alert('Tidak diberi izin: '+err.message);
      setStatus('idle');
    }, { enableHighAccuracy:true, timeout:15000 });
  }

  // Stop sharing (remove DB entry)
  async function stopShare(){
    if(!currentToken){ setStatus('idle'); return; }
    const ref = db.ref('shares/'+currentToken);
    try{
      await ref.remove();
    }catch(e){ console.warn(e); }
    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    currentToken = null;
    shareBtn.textContent = 'Share my location';
    linkEl.textContent = '—';
    document.getElementById('coords').textContent = '—';
    setStatus('idle');
    if(marker) { map.removeLayer(marker); marker = null; }
  }

  // Copy/open handlers
  copyBtn.addEventListener('click', ()=>{
    const t = linkEl.textContent;
    if(!t || t==='—') return alert('Tidak ada link');
    navigator.clipboard.writeText(t).then(()=>alert('Link disalin ke clipboard'));
  });
  openBtn.addEventListener('click', ()=>{ const t = linkEl.textContent; if(t && t!=='—') window.open(t,'_blank'); });

  shareBtn.addEventListener('click', startShare);
  stopBtn.addEventListener('click', stopShare);

  // If page opened with ?id=token -> view mode
  (function initViewer(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if(!id) return;
    setStatus('viewing');
    const ref = db.ref('shares/'+id);
    // listen for real-time updates
    ref.on('value', snap=>{
      const v = snap.val();
      if(!v){ setStatus('not found / stopped'); linkEl.textContent = '—'; document.getElementById('coords').textContent='—'; if(marker){map.removeLayer(marker); marker=null;} return; }
      // check expiry
      if(v.expiresAt && Date.now() > v.expiresAt){ setStatus('expired'); return; }
      linkEl.textContent = window.location.href;
      setMarker(v.lat, v.lng, v.label || 'Shared location');
    });
  })();

  function setStatus(s){ document.getElementById('status').textContent = s; }
  </script>
</body>
</html>
